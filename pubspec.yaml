name: agri_alert
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^7.0.2
  flutter_native_splash: ^2.4.7
  google_maps_flutter: ^2.14.0
  flutter_svg: ^2.0.10
  iconify_flutter: ^0.0.7
  iconsax: ^0.0.8
  flutter_launcher_icons: ^0.14.4
  camera: ^0.11.3
  image_picker: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/Icones/
    - assets/images/
    - assets/images/Onboarding/1.png
    - assets/images/Onboarding/2.png
    - assets/images/Onboarding/3.png

flutter_native_splash:
  color: "#FFFFFF"        # ta couleur de fond (vert)
  image: assets/images/splash.png   # ton logo PNG
  android: true
  ios: true
  android_12:
    color: "#FFFFFF"
    image: assets/images/splash.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.jpg"
  min_sdk_android: 21