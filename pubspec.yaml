name: agri_alert
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^7.0.2
  flutter_native_splash: ^2.4.7
  google_maps_flutter: ^2.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/Onboarding/1.png
    - assets/images/Onboarding/2.png
    - assets/images/Onboarding/3.png

flutter_native_splash:
  color: "#FFFFFF"        # ta couleur de fond (vert)
  image: assets/images/splash.png   # ton logo PNG
  android: true
  ios: true
  android_12:
    color: "#FFFFFF"
    image: assets/images/splash.png
